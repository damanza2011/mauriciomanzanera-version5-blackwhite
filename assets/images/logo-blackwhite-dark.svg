<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <!-- Constellation Nodes & Connecting Rods in Crisp White -->
  <g id="constellation" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round">
    <!-- Lines from center (400, 155) -->
    <line x1="400" y1="155" x2="330" y2="52" />
    <line x1="400" y1="155" x2="455" y2="82" />
    <line x1="400" y1="155" x2="540" y2="155" stroke-width="6.5" />
    <line x1="400" y1="155" x2="465" y2="242" />
    <line x1="400" y1="155" x2="338" y2="230" />
    <line x1="400" y1="155" x2="258" y2="155" />

    <!-- Circles -->
    <circle cx="330" cy="52" r="18" fill="#FFFFFF" stroke="none" />
    <circle cx="455" cy="82" r="11" fill="#FFFFFF" stroke="none" />
    <circle cx="540" cy="155" r="26" fill="#FFFFFF" stroke="none" />
    <circle cx="465" cy="242" r="21" fill="#FFFFFF" stroke="none" />
    <circle cx="338" cy="230" r="22" fill="#FFFFFF" stroke="none" />
    <circle cx="258" cy="155" r="15" fill="#FFFFFF" stroke="none" />

    <!-- Center Hub -->
    <circle cx="400" cy="155" r="40" fill="#FFFFFF" stroke="none" />
  </g>

  <!-- Legend Line 1: Red Global Consultorías -->
  <text x="400" y="375" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Montserrat', 'Century Gothic', -apple-system, sans-serif" font-size="52" font-weight="300" fill="#FFFFFF" letter-spacing="-0.5">
    Red Global Consultorías
  </text>

  <!-- Legend Line 2: Mundo Mejor -->
  <text x="400" y="435" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Montserrat', sans-serif" font-size="28" font-weight="400" fill="#E2E8F0" letter-spacing="9">
    Mundo Mejor
  </text>
</svg>